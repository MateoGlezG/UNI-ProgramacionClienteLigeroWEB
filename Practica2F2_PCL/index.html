            </select>
            </div>
          
        </div>

        <!--opcion del menu de  CONFIGURACION-->
        <div id="reserva_puesto" style="display: ;">

            <img src="">

          </article>
          <div>
            <label for="espacio"> Tipo de Espacio: </label>

 </form>
